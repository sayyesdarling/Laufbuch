<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laufbuch</title>
<meta name="description" content="Training plan, run log and session guide.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Laufbuch">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="update" id="updateBar" hidden>
  <span>A new version of Laufbuch is ready.</span>
  <button type="button" data-act="update-app">Reload</button>
</div>
<main class="wrap" id="view" tabindex="-1">
  <p class="loading">Loading…</p>
</main>
<nav class="tabbar" aria-label="Sections">
  <a href="#plan" data-view="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4M7.5 13.5h3M7.5 17h6"/></svg><span>Plan</span></a>
  <a href="#runs" data-view="runs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg><span>Runs</span></a>
  <a href="#guide" data-view="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>Guide</span></a>
  <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a>
</nav>
<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-act="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" tabindex="-1">
    <div class="sheet-top"><span class="grip" aria-hidden="true"></span><button type="button" class="sheet-close" data-act="close-sheet" aria-label="Close">×</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="importInput" multiple hidden>
<input type="file" id="backupInput" accept=".json,application/json" hidden>
<noscript><p style="padding:16px">Laufbuch needs JavaScript.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
